<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos Matemáticos - Rastros</title>
  <link rel="stylesheet" href="style.css">
  <script src="jogo_module.js"></script>
</head>
<body>

<h1 id="game-title">Rastros</h1>
<div id="game-end-message" style="margin-top: 20px; text-align: center; font-size: 1.2em; font-weight: bold; color: blue;"></div>

<div id="game-settings-container" style="display: flex; flex-wrap: wrap; justify-content: space-around; align-items: flex-start; gap: 10px; margin-top: 20px; margin-bottom: 10px;">

  <div class="settings-section" style="text-align: center; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; min-width: 230px; flex-grow: 1; box-sizing: border-box;">
    <h3 style="margin-top:0; margin-bottom: 12px; font-size: 1.1em; color: #333;">Tamanho do Tabuleiro</h3>
    <div>
      <label for="board-size-select" style="display: inline-block; margin-bottom: 5px;">Tamanho (LxA):</label><br>
      <select id="board-size-select" style="padding: 5px;">
        <option value="5x5">5x5</option>
        <option value="6x5">6x5</option>
        <option value="7x5">7x5</option>
        <option value="8x5">8x5</option>
        <option value="9x5">9x5</option>
        <option value="6x6">6x6</option>
        <option value="6x7">6x7</option>
        <option value="6x8">6x8</option>
        <option value="7x7" selected>7x7</option>
        <option value="custom" disabled hidden>Personalizado</option>
      </select>
    </div>
  </div>

  <div class="settings-section" style="text-align: center; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; min-width: 230px; flex-grow: 1; box-sizing: border-box;">
    <h3 style="margin-top:0; margin-bottom: 12px; font-size: 1.1em; color: #333;">Dificuldade</h3>
    <label for="game-value-slider" style="display: inline-block; margin-bottom: 8px;">Nível: <span id="current-slider-value">1</span></label><br>
    <input type="range" id="game-value-slider" min="1" max="10" value="1" style="width: 80%; max-width: 200px;">
  </div>

  <div class="settings-section" style="text-align: center; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; min-width: 230px; flex-grow: 1; box-sizing: border-box;">
    <fieldset style="border: none; padding: 0; margin: 0;">
      <legend style="font-weight: bold; margin-bottom: 10px; font-size: 1.1em; width: 100%; text-align: center; color: #333;">Modo de Jogo</legend>
      <div style="text-align: left; display: inline-block;">
        <input type="radio" id="player1_vs_ai" name="game_mode" value="player1_vs_ai" checked>
        <label for="player1_vs_ai">Jogador 1 vs IA</label><br>
        <input type="radio" id="player2_vs_ai" name="game_mode" value="player2_vs_ai">
        <label for="player2_vs_ai">IA vs Jogador 2</label><br>
        <input type="radio" id="two_players" name="game_mode" value="two_players">
        <label for="two_players">2 Jogadores</label>
      </div>
    </fieldset>
  </div>

</div>
<div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
  <button id="new-game-button">Iniciar Novo Jogo</button>
</div>
<div id="main-container">
  <div id="board-area">
    <div id="row-labels">
    </div>
    <div id="game-board">
    </div>
    <div class="corner-spacer"></div>
    <div id="col-labels">
    </div>
  </div>
  <div style="text-align: center; margin-top: 10px; margin-bottom: 20px;">
    <button id="usar_ia" style="background-color: firebrick">Fazer jogada IA</button>
  </div>
  <div id="moves-area">
    <h2>Histórico de Jogadas</h2>
    <table id="moves-table">
      <thead>
      <tr>
        <th>Nº</th>
        <th>Jogador 1</th>
        <th>Jogador 2</th>
      </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</div>

<div id="results-container">
  <h2>Resultados</h2>
  <table id="results-table">
    <thead>
    <tr>
      <th>Tamanho do Tabuleiro</th>
      <th>Jogador 1 vs IA</th>
      <th>AI 1 vs Jogador 2</th>
      <th>Jogador 1 vs Jogador 2</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>


<div id="advanced-controls" style="text-align: center; margin-top:20px; display: none;">
  <button id="encode-button">Codificar Estado & Jogada IA (Depuração)</button>
  <div id="encoded-output" style="margin-top:5px; word-break: break-all;"></div>
  <input type="text" id="decode-input" placeholder="Cole o estado codificado para carregar" style="margin-top:5px; width: 80%;">
  <button id="decode-button" style="margin-top:5px;">Carregar Estado</button>
  <div id="decode-message" style="margin-top:5px;"></div>
</div>
<iframe
        id="footer-iframe"
        src="https://danieloliveira1802875.github.io/cnjm-footer/"
        title="CNJM Footer Content"
        scrolling="no">
</iframe>

<script src="script.js"></script>


</body>

</html>
